<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Room</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    .card {
      background: #16213e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      width: 480px;
    }

    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      image-rendering: pixelated;
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(26, 26, 46, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a0c4ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #69d16b;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .info {
      padding: 20px 24px 24px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #7a8a9a;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tag {
      background: rgba(160, 196, 255, 0.1);
      border: 1px solid rgba(160, 196, 255, 0.2);
      color: #a0c4ff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: #4a90e2;
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: #c0c0c0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.11); }
  </style>
</head>
<body>
  <div class="card">
    <div class="scene">
      <img src="24f078c1e95d5bd775996816eb549b6a0d039188c8147ced147a90fb47208718.gif" alt="Cozy pixel art room" />
      <div class="badge">
        <span class="dot"></span>
        Live scene
      </div>
    </div>
    <div class="info">
      <div class="title">Cozy Room</div>
      <div class="subtitle">A peaceful pixel art bedroom — warm afternoon light filters through the window as monstera leaves sway gently.</div>
      <div class="tags">
        <span class="tag">pixel art</span>
        <span class="tag">lofi</span>
        <span class="tag">ambient</span>
      </div>
      <div class="actions">
        <button class="btn btn-primary">Explore scenes</button>
        <button class="btn btn-secondary">Save</button>
      </div>
    </div>
  </div>
</body>
</html>
